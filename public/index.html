<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaims</title>
<meta name="description" content="A public registry of verified AI evaluation claims.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --fg: #111; --muted: #6b6b6b; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --muted: #9a9a9a; --bg: #0b0b0b; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 2rem; box-sizing: border-box;
    background: var(--bg); color: var(--fg);
    font: 400 1.0625rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 28rem; }
  h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { margin: 0; text-wrap: balance; }
  .muted { color: var(--muted); margin-top: 1.5rem; font-size: 0.9375rem; }
</style>
</head>
<body>
<main>
  <h1>OpenClaims</h1>
  <p>A public registry of verified AI evaluation claims.</p>
  <p class="muted">Coming soon.</p>
</main>
</body>
</html>
